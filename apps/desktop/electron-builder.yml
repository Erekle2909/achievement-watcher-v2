appId: com.achievement-watcher.app
productName: Achievement Watcher
copyright: Copyright © 2026

directories:
  output: ../../release
  buildResources: build

files:
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: "${productName}-${version}-Setup.${ext}"

nsis:
  oneClick: false
  allowToDowngrade: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: "${productName}-${version}-Portable.${ext}"

publish:
  provider: github
  owner: Erekle2909
  repo: achievement-watcher-v2
